<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日學習表 - 學習鬧鐘</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #fdf6f5; /* 柔和的米粉色背景 */
            color: #4a4a4a;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(230, 200, 200, 0.3);
        }
        .theme-pink { background-color: #fce4ec; color: #d81b60; }
        .theme-blue { background-color: #e1f5fe; color: #0288d1; }
        .theme-purple { background-color: #ede7f6; color: #5e35b1; }
        
        /* 水晶玻璃質感按鈕 (Crystal Glass Button) */
        .crystal-btn {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0.3) 50%, rgba(255, 255, 255, 0.6) 100%) !important;
            backdrop-filter: blur(14px) saturate(160%);
            -webkit-backdrop-filter: blur(14px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.85) !important;
            box-shadow: 
                0 6px 18px -2px rgba(215, 175, 185, 0.28),
                inset 0 1.5px 2px 0 rgba(255, 255, 255, 0.95),
                inset 0 -1.5px 2px 0 rgba(190, 160, 170, 0.12) !important;
            position: relative;
            overflow: hidden;
            transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .crystal-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 48%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.65) 0%, rgba(255, 255, 255, 0.05) 100%);
            border-radius: 9999px 9999px 0 0;
            pointer-events: none;
        }
        .crystal-btn:hover {
            transform: translateY(-1.5px);
            box-shadow: 
                0 10px 22px -2px rgba(215, 165, 180, 0.4),
                inset 0 2px 3px 0 rgba(255, 255, 255, 1),
                inset 0 -1px 2px 0 rgba(190, 160, 170, 0.1) !important;
        }
        .crystal-btn:active {
            transform: translateY(0.5px);
        }

        /* 金屬質感金色鬧鐘樣式 (Metallic Gold Alarm) */
        .metallic-gold-alarm {
            background: linear-gradient(135deg, #fff6c7 0%, #ffd700 28%, #e2ab24 65%, #ffd45e 100%) !important;
            color: #6d4700 !important;
            border: 1px solid #ffd84d !important;
            box-shadow: 
                0 4px 14px rgba(226, 171, 36, 0.5),
                inset 0 1.5px 1.5px rgba(255, 255, 255, 0.95),
                inset 0 -1.5px 2px rgba(110, 75, 0, 0.35) !important;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.7);
            transform: scale(1.06);
            transition: all 0.2s ease-out;
        }
        .metallic-gold-alarm i {
            filter: drop-shadow(0 1px 2px rgba(120, 80, 0, 0.5));
            animation: gentle-ring 2s infinite;
        }

        /* 羊毛氈風格設定面板 (Wool Felt Style) */
        .felt-wool-modal {
            background-color: #f6ede3;
            background-image: 
                radial-gradient(rgba(175, 140, 115, 0.13) 15%, transparent 16%),
                radial-gradient(rgba(215, 185, 160, 0.12) 15%, transparent 16%),
                linear-gradient(135deg, rgba(255, 248, 240, 0.7) 0%, rgba(242, 230, 218, 0.7) 100%);
            background-size: 8px 8px, 12px 12px, 100% 100%;
            background-position: 0 0, 4px 4px, 0 0;
            border: 3px dashed #cbaf96 !important;
            outline: 6px solid #f1e4d6;
            box-shadow: 
                0 25px 50px -12px rgba(110, 75, 55, 0.3),
                inset 0 0 35px rgba(185, 150, 130, 0.15) !important;
            position: relative;
        }
        .felt-item-card {
            background: rgba(255, 253, 249, 0.92);
            border: 2px dashed #dbc4b0;
            border-radius: 1.25rem;
            box-shadow: 0 3px 8px rgba(150, 120, 100, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }
        .felt-stitch-border {
            border: 1.5px dashed #d7beaa;
        }

        /* 自訂核取方塊樣式 */
        .custom-checkbox {
            appearance: none;
            background-color: #fff;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.5em;
            height: 1.5em;
            border: 2px solid #ffb6c1;
            border-radius: 0.25em;
            display: grid;
            place-content: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        .custom-checkbox::before {
            content: "";
            width: 0.8em;
            height: 0.8em;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em white;
            background-color: white;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        .custom-checkbox:checked {
            background-color: #ff9a9e;
            border-color: #ff9a9e;
        }
        .custom-checkbox:checked::before {
            transform: scale(1);
        }

        /* 動畫 */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 0; }
        }
        .alarm-ringing {
            animation: shake 0.5s infinite;
        }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        /* 模態框淡入淡出 */
        .modal-enter { opacity: 0; transform: scale(0.9); }
        .modal-enter-active { opacity: 1; transform: scale(1); transition: all 0.3s ease-out; }
        .modal-exit { opacity: 1; transform: scale(1); }
        .modal-exit-active { opacity: 0; transform: scale(0.9); transition: all 0.2s ease-in; }

        /* 彈出提示動畫 (Tooltip Pop-in) */
        @keyframes tooltip-bounce {
            0% { transform: translate(-50%, 4px) scale(0.95); opacity: 0; }
            50% { transform: translate(-50%, -2px) scale(1.03); opacity: 1; }
            100% { transform: translate(-50%, 0) scale(1); opacity: 1; }
        }
        .tooltip-pop-in {
            animation: tooltip-bounce 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

    <!-- 隱藏的按鈕，用於強制初始化音訊 -->
    <button id="init-audio-btn" class="hidden">初始化音訊</button>

    <script>
        // --- 音效系統設定 ---
        let audioCtx;
        let beepInterval;
        let isTicking = false;
        let tickInterval;
        let isVoiceEnabled = true;

        // 初始化語音清單
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // 語音播報功能 (原生 Web Speech Synthesis，無延遲零依賴)
        function speakText(text) {
            if (!isVoiceEnabled || !('speechSynthesis' in window)) return;
            try {
                window.speechSynthesis.cancel(); // 停止前一段發音
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-TW';
                utterance.rate = 0.92; // 沉穩親切的語速
                utterance.pitch = 1.05; // 稍微輕快自然的聲調
                
                const voices = window.speechSynthesis.getVoices();
                const zhVoice = voices.find(v => v.lang === 'zh-TW' || v.lang.includes('TW')) || 
                                voices.find(v => v.lang.startsWith('zh') || v.lang.includes('cmn'));
                if (zhVoice) {
                    utterance.voice = zhVoice;
                }
                window.speechSynthesis.speak(utterance);
            } catch (e) {
                console.error("語音提醒播放失敗:", e);
            }
        }

        // 開關語音提醒
        function toggleVoice() {
            initAudio();
            playClickSound();
            isVoiceEnabled = !isVoiceEnabled;
            const btn = document.getElementById('voice-btn');
            if (isVoiceEnabled) {
                btn.classList.add('text-pink-600');
                btn.innerHTML = '<i class="fa-solid fa-volume-high mr-2 text-pink-400"></i> 語音提醒: 開';
                showMessage('<i class="fa-solid fa-volume-high mr-2"></i>語音提醒已開啟！', true);
                speakText("語音提醒已開啟");
            } else {
                btn.classList.remove('text-pink-600');
                btn.innerHTML = '<i class="fa-solid fa-volume-xmark mr-2 text-gray-400"></i> 語音提醒: 關';
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                showMessage('<i class="fa-solid fa-volume-xmark mr-2"></i>語音提醒已關閉。');
            }
        }

        // 初始化 AudioContext，必須在使用者有互動後才能呼叫
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 綁定點擊事件來初始化音訊，這可以突破瀏覽器的自動播放限制
        document.body.addEventListener('click', initAudio, { once: true });
        // 也給輸入框綁定，以防使用者第一個動作是輸入時間
        document.body.addEventListener('input', initAudio, { once: true });

        // 1. 按鈕點擊音效 (柔和的短促聲)
        function playClickSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.05);
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        // 2. 任務完成音效 (輕快的琶音)
        function playSuccessSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const playNote = (freq, startTime, duration) => {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                gainNode.gain.setValueAtTime(0, startTime);
                gainNode.gain.linearRampToValueAtTime(0.15, startTime + 0.05);
                gainNode.gain.linearRampToValueAtTime(0, startTime + duration);
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                osc.start(startTime);
                osc.stop(startTime + duration);
            };
            // 播放 C大調和弦上行：Do(523) -> Mi(659) -> Sol(784) -> 高音Do(1046)
            playNote(523.25, now, 0.15);
            playNote(659.25, now + 0.1, 0.15);
            playNote(783.99, now + 0.2, 0.15);
            playNote(1046.50, now + 0.3, 0.4);
        }

        // 3. 背景滴答聲 (模擬時鐘或節拍器)
        function playTick() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'triangle'; // 三角波有輕微的敲擊感
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.03);
        }

        // 4. 播放「滴滴」兩聲的鬧鐘音效
        function playDoubleBeep() {
            if (!audioCtx) return;

            function playSingleBeep(startTime) {
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                // 使用方波聽起來更像電子鬧鐘
                oscillator.type = 'square';
                // 較高的頻率
                oscillator.frequency.setValueAtTime(1200, startTime); 
                
                // 聲音淡入淡出，避免爆音
                gainNode.gain.setValueAtTime(0, startTime);
                gainNode.gain.linearRampToValueAtTime(0.5, startTime + 0.02);
                gainNode.gain.linearRampToValueAtTime(0, startTime + 0.15);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start(startTime);
                oscillator.stop(startTime + 0.15);
            }

            const now = audioCtx.currentTime;
            playSingleBeep(now);             // 第一聲
            playSingleBeep(now + 0.2);       // 停頓 0.2 秒後發出第二聲
        }

        // 5. 錯誤提示音效 (短促低音提醒)
        function playErrorSound() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(140, audioCtx.currentTime + 0.15);
                gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch (e) {}
        }

        // 時間計算輔助函式：加上指定分鐘數
        function addMinutes(timeStr, minsToAdd) {
            if (!timeStr) return '';
            const [h, m] = timeStr.split(':').map(Number);
            const date = new Date();
            date.setHours(h, m, 0, 0);
            date.setMinutes(date.getMinutes() + minsToAdd);
            const newH = date.getHours().toString().padStart(2, '0');
            const newM = date.getMinutes().toString().padStart(2, '0');
            return `${newH}:${newM}`;
        }

                        itemClasses += ` border-2 border-pink-400 shadow-[0_0_15px_rgba(244,114,182,0.6)] bg-pink-50 animate-[pulse_1s_infinite]`;
                    } else if (task.isSelected === false) {
                        // 未勾選加入排程時的視覺微調
                        itemClasses += ` opacity-80 grayscale-[20%]`;
                    } else {
                        itemClasses += ` hover:bg-white`;
                    }
                    taskItem.className = itemClasses;
                    
                    const leftCol = document.createElement('div');
                    leftCol.className = 'flex items-center mb-4 lg:mb-0 w-full lg:w-1/3 flex-grow';
                    
                    const flexDiv = document.createElement('div');
                    flexDiv.className = 'flex items-center w-full';

                    // 1. 排程選取 Checkbox (新加入)
                    const selectCheckbox = document.createElement('input');
                    selectCheckbox.type = 'checkbox';
                    selectCheckbox.className = 'w-5 h-5 mr-3 flex-shrink-0 cursor-pointer accent-pink-500 rounded border-gray-300';
                    selectCheckbox.checked = task.isSelected !== false; // 預設為 true (包含 undefined)
                    selectCheckbox.title = "勾選加入自動排程";
                    selectCheckbox.onchange = (e) => {
                        initAudio();
                        playClickSound();
                        task.isSelected = e.target.checked;
                        renderCourses();
                    };
                    flexDiv.appendChild(selectCheckbox);

                    // 2. 完成 Checkbox (原本的 custom-checkbox)
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.className = 'custom-checkbox mr-4 flex-shrink-0';
                    checkbox.checked = task.completed;
                    checkbox.onchange = (e) => toggleTaskComplete(catIndex, taskIndex, e.target.checked);
                    flexDiv.appendChild(checkbox);
                    
                    // 3. Number badge (only for English category based on image)
                    if (category.id === 'cat-1') {
                        const bgColors = ['bg-pink-300', 'bg-indigo-300', 'bg-blue-400'];
                        const numBadge = document.createElement('div');
                        numBadge.className = `${bgColors[taskIndex % 3]} text-white w-7 h-7 rounded-full flex items-center justify-center text-sm font-bold mr-3 flex-shrink-0 shadow-sm`;
                        numBadge.textContent = taskIndex + 1;
                        flexDiv.appendChild(numBadge);
                    }

                    // 4. Task Name
                    const nameSpan = document.createElement('span');
                    nameSpan.className = `text-lg font-medium transition-colors ${task.isSelected === false ? 'text-gray-400' : 'text-[#5d4037]'} ${task.completed ? 'line-through' : ''}`;
                    nameSpan.textContent = task.name;
                    flexDiv.appendChild(nameSpan);

                    leftCol.appendChild(flexDiv);

                    const rightCol = document.createElement('div');
                    rightCol.className = 'flex flex-col sm:flex-row items-start sm:items-center space-y-2 sm:space-y-0 sm:space-x-3 ml-[2.5rem] lg:ml-0';

                    // 裝飾圖示
                    if (task.icon) {
                        const iconSpan = document.createElement('div');
                        iconSpan.className = `w-8 h-8 rounded-full bg-white flex items-center justify-center shadow-sm ${task.iconColor} mr-2 hidden lg:flex flex-shrink-0`;
                        iconSpan.innerHTML = `<i class="fa-solid ${task.icon}"></i>`;
                        rightCol.appendChild(iconSpan);
                    }

                    // 時間設定群組
                    const timeContainer = document.createElement('div');
                    timeContainer.className = 'flex flex-wrap items-center gap-2 w-full sm:w-auto';

                    // 開始時間 (加入鎖定時的灰階背景與透明度視覺特效)
                    const startTimeGroup = document.createElement('div');
                    startTimeGroup.id = `time-group-${catIndex}-${taskIndex}-startTime`;
                    startTimeGroup.className = `relative flex items-center rounded-lg p-1 border shadow-inner flex-1 sm:flex-none transition-all duration-300 ${task.completed ? 'bg-gray-100 border-gray-300 opacity-60' : 'bg-white border-gray-200'}`;
                    startTimeGroup.innerHTML = `<span class="text-xs ${task.completed ? 'text-gray-400' : 'text-gray-500'} mr-1 ml-1 whitespace-nowrap">開始</span>`;
                    
                    const startTimeInput = document.createElement('input');
                    startTimeInput.id = `time-input-${catIndex}-${taskIndex}-startTime`;
                    startTimeInput.type = 'time';
                    startTimeInput.className = `bg-transparent border-none outline-none font-medium px-1 text-sm w-full sm:w-auto transition-colors ${task.completed ? 'text-gray-400 cursor-not-allowed' : 'text-[#5d4037]'}`;
                    startTimeInput.value = task.startTime;
                    startTimeInput.disabled = task.completed; // 完成時鎖定
                    startTimeInput.onchange = (e) => updateTaskTime(catIndex, taskIndex, 'startTime', e.target.value, e.target);
                    startTimeGroup.appendChild(startTimeInput);

                    // 結束時間 (加入鎖定時的灰階背景與透明度視覺特效)
                    const endTimeGroup = document.createElement('div');
                    endTimeGroup.id = `time-group-${catIndex}-${taskIndex}-endTime`;
                    endTimeGroup.className = `relative flex items-center rounded-lg p-1 border shadow-inner flex-1 sm:flex-none transition-all duration-300 ${task.completed ? 'bg-gray-100 border-gray-300 opacity-60' : 'bg-white border-gray-200'}`;
                    endTimeGroup.innerHTML = `<span class="text-xs ${task.completed ? 'text-gray-400' : 'text-gray-500'} mr-1 ml-1 whitespace-nowrap">結束</span>`;
                    
                    const endTimeInput = document.createElement('input');
                    endTimeInput.id = `time-input-${catIndex}-${taskIndex}-endTime`;
                    endTimeInput.type = 'time';
                    endTimeInput.className = `bg-transparent border-none outline-none font-medium px-1 text-sm w-full sm:w-auto transition-colors ${task.completed ? 'text-gray-400 cursor-not-allowed' : 'text-[#5d4037]'}`;
                    endTimeInput.value = task.endTime;
                    endTimeInput.disabled = task.completed || task.isAlarmActive;
                    endTimeInput.onchange = (e) => updateTaskTime(catIndex, taskIndex, 'endTime', e.target.value, e.target);
                    endTimeGroup.appendChild(endTimeInput);

                    // 鬧鐘切換按鈕 (按下啟用時呈現金屬質感的金色)
                    const alarmBtn = document.createElement('button');
                    alarmBtn.className = `p-2 rounded-xl transition-all flex-shrink-0 ml-auto sm:ml-0 ${
                        task.isAlarmActive 
                            ? 'metallic-gold-alarm' 
                            : 'crystal-btn text-gray-400 hover:text-amber-500'
                    } ${task.completed ? 'opacity-50 cursor-not-allowed' : ''}`;
                    alarmBtn.disabled = task.completed;
                    alarmBtn.innerHTML = `<i class="fa-solid fa-bell${task.isAlarmActive ? ' ring-animation' : ''}"></i>`;
                    alarmBtn.onclick = () => toggleAlarm(catIndex, taskIndex);
                    
                    if(!task.startTime && !task.endTime && !task.isAlarmActive) {
                        alarmBtn.title = "請先設定開始或結束時間";
                    } else if (task.isAlarmActive) {
                         alarmBtn.title = "點擊取消鬧鐘 (已啟用金色開始/結束語音提醒)";
                    } else {
                         alarmBtn.title = "點擊開啟鬧鐘 (支援開始與結束語音提醒)";
                    }

                    timeContainer.appendChild(startTimeGroup);
                    timeContainer.appendChild(endTimeGroup);
                    timeContainer.appendChild(alarmBtn);

                    rightCol.appendChild(timeContainer);

                    taskItem.appendChild(leftCol);
                    taskItem.appendChild(rightCol);
                    taskList.appendChild(taskItem);
                });

                catDiv.appendChild(taskList);
                container.appendChild(catDiv);
            });
        }
        
        // 執行連鎖排程計算
        function executeCascadeSchedule(startCatIdx, startTaskIdx, startT) {
            let allTasks = [];
            let startIndex = -1;
            
            // 將所有任務攤平為一維陣列以便依序處理
            for (let c = 0; c < courseData.length; c++) {
                for (let t = 0; t < courseData[c].tasks.length; t++) {
                    allTasks.push(courseData[c].tasks[t]);
                    if (c === startCatIdx && t === startTaskIdx) {
                        startIndex = allTasks.length - 1;
                    }
                }
            }

            // 設定起始任務的結束時間 (學習25分)
            let currentEndTime = addMinutes(startT, 25);
            allTasks[startIndex].endTime = currentEndTime;

            // 從基準點的下一個任務開始往後推算
            let scheduledCount = 1;
            for (let i = startIndex + 1; i < allTasks.length; i++) {
                let t = allTasks[i];
                
                // 【重點修改】：如果沒有勾選加入排程，則跳過此項目不設定時間
                if (t.isSelected === false) {
                    continue;
                }
                
                // 休息 breakMins 分鐘後開始下一個
                let newStartTime = addMinutes(currentEndTime, autoBreakTime); 
                // 學習 25 分鐘後結束
                let newEndTime = addMinutes(newStartTime, 25);   
                
                t.startTime = newStartTime;
                t.endTime = newEndTime;
                
                currentEndTime = newEndTime;
                scheduledCount++;
            }

            showMessage(`<i class="fa-solid fa-check-circle mr-2"></i>已為 ${scheduledCount} 個選取的項目自動排程！`, true);
        }

        // 時間字串轉分鐘數
        function timeToMinutes(t) {
            if (!t) return null;
            const [h, m] = t.split(':').map(Number);
            return h * 60 + m;
        }

        // 檢查輸入的時間是否重複或產生時段衝突
        function isTimeDuplicateOrInvalid(catIndex, taskIndex, timeType, newTime) {
            if (!newTime) return false;
            
            const currentTask = courseData[catIndex].tasks[taskIndex];
            const newMins = timeToMinutes(newTime);
            if (newMins === null) return true;

            // 1. 同一任務的開始時間與結束時間不可相同或顛倒
            if (timeType === 'startTime') {
                if (currentTask.endTime) {
                    const endMins = timeToMinutes(currentTask.endTime);
                    if (newTime === currentTask.endTime || newMins >= endMins) {
                        return true;
                    }
                }
            } else if (timeType === 'endTime') {
                if (currentTask.startTime) {
                    const startMins = timeToMinutes(currentTask.startTime);
                    if (newTime === currentTask.startTime || newMins <= startMins) {
                        return true;
                    }
                }
            }

            // 整理需要進行比對的任務清單
            let tasksToCheck = [];
            let passedCurrent = false;

            for (let c = 0; c < courseData.length; c++) {
                for (let t = 0; t < courseData[c].tasks.length; t++) {
                    const isCurrent = (c === catIndex && t === taskIndex);
                    if (isCurrent) {
                        passedCurrent = true;
                        continue;
                    }

                    // 若正在自動排程模式且設定開始時間，後續勾選的項目會被依序覆蓋重排，不列入前置比對
                    if (autoScheduleMode && timeType === 'startTime' && passedCurrent) {
                        if (courseData[c].tasks[t].isSelected !== false) {
                            continue;
                        }
                    }

                    tasksToCheck.push(courseData[c].tasks[t]);
                }
            }

            // 2. 比對所有其他任務，確保沒有相同的時間點或重疊時段
            for (const other of tasksToCheck) {
                // 不能有完全相同的時間點（開始或結束均不可重複）
                if ((other.startTime && other.startTime === newTime) || 
                    (other.endTime && other.endTime === newTime)) {
                    return true;
                }

                // 檢查是否落入其他任務正在學習的區間內 (時段重疊)
                if (other.startTime && other.endTime) {
                    const otherStart = timeToMinutes(other.startTime);
                    const otherEnd = timeToMinutes(other.endTime);
                    if (otherStart !== null && otherEnd !== null && otherStart < otherEnd) {
                        if (newMins > otherStart && newMins < otherEnd) {
                            return true;
                        }

                        // 若當前任務已有另一端時間，檢查整體區間是否與既有項目交錯
                        if (timeType === 'startTime' && currentTask.endTime) {
                            const curEnd = timeToMinutes(currentTask.endTime);
                            if (curEnd !== null && Math.max(newMins, otherStart) < Math.min(curEnd, otherEnd)) {
                                return true;
                            }
                        } else if (timeType === 'endTime' && currentTask.startTime) {
                            const curStart = timeToMinutes(currentTask.startTime);
                            if (curStart !== null && Math.max(curStart, otherStart) < Math.min(newMins, otherEnd)) {
                                return true;
                            }
                        }
                    }
                }
            }

            return false;
        }

        // 顯示在特定輸入框正上方的紅色警示提示
        function showTimeInputError(catIndex, taskIndex, timeType, targetInput) {
            initAudio();
            playErrorSound();

            const groupEl = (targetInput && targetInput.parentElement) || 
                            document.getElementById(`time-group-${catIndex}-${taskIndex}-${timeType}`);
            const inputEl = targetInput || 
                            document.getElementById(`time-input-${catIndex}-${taskIndex}-${timeType}`);
            
            // 清空錯誤輸入值
            if (inputEl) {
                inputEl.value = '';
            }
            
            if (!groupEl) return;
            
            // 清除之前的計時器與舊提示（若有）
            if (groupEl._errorTimer) {
                clearTimeout(groupEl._errorTimer);
            }
            const oldTooltip = groupEl.querySelector('.time-error-tooltip');
            if (oldTooltip) oldTooltip.remove();
            
            // 建立在時間輸入框正上方的紅色警示氣泡 (含指向輸入框的倒三角指示箭頭)
            const tooltip = document.createElement('div');
            tooltip.className = 'tooltip-pop-in time-error-tooltip absolute bottom-full mb-2 left-1/2 z-50 flex flex-col items-center pointer-events-none drop-shadow-lg';
            tooltip.innerHTML = `
                <div class="bg-red-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow-lg flex items-center whitespace-nowrap gap-1.5 border border-red-300">
                    <i class="fa-solid fa-circle-exclamation text-amber-200 text-sm"></i>
                    <span>時間輸入有誤，請重新輸入</span>
                </div>
                <div class="w-0 h-0 border-x-[5px] border-x-transparent border-t-[6px] border-t-red-500"></div>
            `;
            
            // 為當前輸入群組加入紅色醒目外框與淡紅底色，並提升圖層深度
            groupEl.style.zIndex = '50';
            groupEl.classList.add('border-red-500', 'ring-2', 'ring-red-300', 'bg-red-50');
            groupEl.classList.remove('bg-white', 'border-gray-200');
            groupEl.appendChild(tooltip);
            
            // 2.6 秒後平滑淡出並移除提示與高亮外框
            groupEl._errorTimer = setTimeout(() => {
                tooltip.style.transition = 'all 0.25s ease-out';
                tooltip.style.opacity = '0';
                tooltip.style.transform = 'translate(-50%, -4px) scale(0.95)';
                setTimeout(() => {
                    tooltip.remove();
                    groupEl.style.zIndex = '';
                    groupEl.classList.remove('border-red-500', 'ring-2', 'ring-red-300', 'bg-red-50');
                    groupEl.classList.add('bg-white', 'border-gray-200');
                }, 250);
            }, 2600);
        }

        function updateTaskTime(catIndex, taskIndex, timeType, timeValue, targetInput) {
            initAudio();
            playClickSound(); // 設定時間時發出按鍵音
            
            // 驗證輸入時間是否重複或有衝突
            if (timeValue) {
                if (isTimeDuplicateOrInvalid(catIndex, taskIndex, timeType, timeValue)) {
                    courseData[catIndex].tasks[taskIndex][timeType] = '';
                    showTimeInputError(catIndex, taskIndex, timeType, targetInput);
                    return;
                }
            }

            courseData[catIndex].tasks[taskIndex][timeType] = timeValue;

            // 如果啟動了自動排程模式，且使用者設定了「開始時間」
            if (autoScheduleMode && timeType === 'startTime' && timeValue) {
                executeCascadeSchedule(catIndex, taskIndex, timeValue);
                autoScheduleMode = false; // 觸發一次後自動關閉模式
            }
            
            // 重新渲染以更新可能的按鈕狀態
            renderCourses();
        }

        function toggleAlarm(catIndex, taskIndex) {
            initAudio();
            playClickSound(); // 開關鬧鐘時發出按鍵音
            
            const task = courseData[catIndex].tasks[taskIndex];
            
            // 如果正在響鈴，點擊鬧鐘按鈕也可以把它關掉
            if (task.isRinging) {
                clearInterval(beepInterval);
                task.isRinging = false;
                activeAlarmTask = null;
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                renderCourses();
                return;
            }

            if (!task.startTime && !task.endTime) {
                showMessage('<strong class="font-bold">提示：</strong><span class="block sm:inline ml-1"> 請先設定預計開始或結束的時間！</span>');
                return;
            }
            task.isAlarmActive = !task.isAlarmActive;
            renderCourses();
        }

        // 檢查鬧鐘與更新時鐘
        let activeAlarmTask = null;

        // 觸發「開始學習」語音提醒
        function triggerStartReminder(task) {
            initAudio();
            playSuccessSound(); // 悅耳提示音
            speakText(`時間到，請開始學習，${task.name}`);
            showMessage(`<i class="fa-solid fa-bell text-pink-500 mr-2 text-lg animate-bounce"></i>時間到！請開始學習：<strong class="text-pink-600 ml-1 font-bold">${task.name}</strong>`, true);

            // 滾動並高亮該項目
            const el = document.getElementById(`task-item-${task.id}`);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                el.classList.add('ring-2', 'ring-pink-400', 'bg-pink-100/60');
                setTimeout(() => {
                    el.classList.remove('ring-2', 'ring-pink-400', 'bg-pink-100/60');
                }, 4000);
            }
        }

        function updateClockAndCheckAlarms() {
            const now = new Date();
            // 更新頁面時間顯示
            document.getElementById('current-time').textContent = now.toLocaleTimeString('zh-TW', { hour12: false });

            const currentHour = now.getHours().toString().padStart(2, '0');
            const currentMinute = now.getMinutes().toString().padStart(2, '0');
            const currentTimeStr = `${currentHour}:${currentMinute}`;
            const currentSecond = now.getSeconds();

            // 每分鐘的第0秒檢查鬧鐘
            if (currentSecond === 0) {
                for (const category of courseData) {
                    for (const task of category.tasks) {
                        if (!task.isAlarmActive || task.completed) continue;

                        // 1. 開始時間到了 -> 語音播報：「時間到，請開始學習 [子項目]」
                        if (task.startTime === currentTimeStr && task._lastStartFired !== currentTimeStr) {
                            task._lastStartFired = currentTimeStr;
                            triggerStartReminder(task);
                        }

                        // 2. 結束時間到了 -> 響起鬧鐘並語音播報：「學習時間結束，請休息」
                        if (task.endTime === currentTimeStr && !task.isRinging && task._lastEndFired !== currentTimeStr) {
                            task._lastEndFired = currentTimeStr;
                            task.isAlarmActive = false;
                            task.isRinging = true;
                            triggerAlarm(task);
                            renderCourses();

                            setTimeout(() => {
                                const el = document.getElementById(`task-item-${task.id}`);
                                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            }, 100);
                        }
                    }
                }
            }
        }

        function triggerAlarm(task) {
            activeAlarmTask = task;
            
            // 確保音訊系統已初始化並喚醒
            initAudio();

            // 語音播報：學習時間結束，請休息
            speakText("學習時間結束，請休息");

            // 立即播放一次鬧鐘聲音
            playDoubleBeep();
            // 每 2 秒重複播放一次雙聲嗶聲
            beepInterval = setInterval(playDoubleBeep, 2000); 
        }

        // 初始化
        window.onload = () => {
            renderCourses();
            updateClockAndCheckAlarms();
            setInterval(updateClockAndCheckAlarms, 1000); // 每秒更新時間
        };

        // 添加自定義動畫 style
        const style = document.createElement('style');
        style.innerHTML = `
            .ring-animation {
                animation: gentle-ring 2s infinite;
            }
            @keyframes gentle-ring {
                0% { transform: rotate(0); }
                5% { transform: rotate(15deg); }
                10% { transform: rotate(-10deg); }
                15% { transform: rotate(5deg); }
                20% { transform: rotate(-5deg); }
                25% { transform: rotate(0); }
                100% { transform: rotate(0); }
            }
        `;
        document.head.appendChild(style);

    </script>
