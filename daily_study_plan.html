<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日學習表 - 學習鬧鐘</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #fdf6f5; /* 柔和的米粉色背景 */
            color: #4a4a4a;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(230, 200, 200, 0.3);
        }
        .theme-pink { background-color: #fce4ec; color: #d81b60; }
        .theme-blue { background-color: #e1f5fe; color: #0288d1; }
        .theme-purple { background-color: #ede7f6; color: #5e35b1; }
        
        /* 自訂核取方塊樣式 */
        .custom-checkbox {
            appearance: none;
            background-color: #fff;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.5em;
            height: 1.5em;
            border: 2px solid #ffb6c1;
            border-radius: 0.25em;
            display: grid;
            place-content: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        .custom-checkbox::before {
            content: "";
            width: 0.8em;
            height: 0.8em;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em white;
            background-color: white;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        .custom-checkbox:checked {
            background-color: #ff9a9e;
            border-color: #ff9a9e;
        }
        .custom-checkbox:checked::before {
            transform: scale(1);
        }

        /* 動畫 */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 0; }
        }
        .alarm-ringing {
            animation: shake 0.5s infinite;
        }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        /* 模態框淡入淡出 */
        .modal-enter { opacity: 0; transform: scale(0.9); }
        .modal-enter-active { opacity: 1; transform: scale(1); transition: all 0.3s ease-out; }
        .modal-exit { opacity: 1; transform: scale(1); }
        .modal-exit-active { opacity: 0; transform: scale(0.9); transition: all 0.2s ease-in; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

    <header class="w-full max-w-3xl mb-8 text-center relative">
        <h1 class="text-4xl md:text-5xl font-bold mb-2 text-[#8d6e63]" style="font-family: 'Times New Roman', serif; letter-spacing: 2px;">每日學習表</h1>
        <p class="text-xl md:text-2xl text-[#a1887f] italic font-serif mb-6">Daily Study Plan</p>
        
        <div class="absolute right-0 top-0 hidden md:block text-right">
            <p class="text-[#e57373] text-2xl font-serif italic mb-1 transform rotate-[-5deg]">Good Things</p>
            <p class="text-[#e57373] text-2xl font-serif italic mb-1 transform rotate-[-5deg]">Are</p>
            <p class="text-[#e57373] text-3xl font-serif italic transform rotate-[-5deg]">Happening <i class="fa-regular fa-heart text-sm"></i></p>
        </div>

        <div class="inline-block bg-white px-6 py-3 rounded-full shadow-sm text-[#795548] text-sm md:text-base border border-[#f5f5f5]">
            <p>學習讓我成為更好的自己！</p>
            <p>每天進步一點點，夢想越來越近！<i class="fa-regular fa-heart text-[#e57373] ml-1"></i></p>
        </div>
        
        <!-- 當前時間顯示 -->
        <div class="mt-6 glass-panel inline-flex items-center px-6 py-3 rounded-2xl">
            <i class="fa-regular fa-clock text-[#a1887f] text-xl mr-3"></i>
            <span id="current-time" class="text-2xl font-medium text-[#5d4037]">--:--:--</span>
        </div>
        
        <!-- 音效控制面板 -->
        <div class="mt-5 flex flex-wrap justify-center gap-3 w-full">
            <button id="auto-schedule-btn" onclick="toggleAutoScheduleMenu()" class="glass-panel px-4 py-2 rounded-full text-sm font-medium flex items-center text-gray-500 hover:bg-[#fff0f5] hover:text-pink-500 transition-colors shadow-sm cursor-pointer border border-transparent hover:border-pink-200">
                <i class="fa-solid fa-wand-magic-sparkles mr-2"></i> 自動排程
            </button>
            <button id="tick-btn" onclick="toggleTicking()" class="glass-panel px-4 py-2 rounded-full text-sm font-medium flex items-center text-gray-500 hover:bg-gray-100 transition-colors shadow-sm cursor-pointer">
                <i class="fa-solid fa-stopwatch mr-2"></i> 專注滴答聲: 關
            </button>
            <button onclick="testAudio()" class="glass-panel px-4 py-2 rounded-full text-sm font-medium flex items-center text-gray-500 hover:bg-gray-100 transition-colors shadow-sm cursor-pointer">
                <i class="fa-solid fa-music mr-2"></i> 音效測試
            </button>
            <button onclick="resetAll()" class="glass-panel px-4 py-2 rounded-full text-sm font-medium flex items-center text-gray-500 hover:bg-gray-100 transition-colors shadow-sm cursor-pointer hover:text-red-400">
                <i class="fa-solid fa-rotate-right mr-2"></i> 重置
            </button>
        </div>

        <!-- 自動排程子選單 -->
        <div id="auto-schedule-menu" class="hidden mt-4 glass-panel rounded-2xl p-3 flex-wrap justify-center gap-2 items-center transition-all duration-300 transform scale-95 opacity-0 mx-auto w-max max-w-full shadow-md border border-pink-100">
            <span class="text-sm text-[#8d6e63] font-medium mr-1"><i class="fa-solid fa-mug-hot mr-1"></i>休息：</span>
            <button onclick="applyAutoSchedule(5)" class="px-3 py-1.5 bg-[#fce4ec] text-[#d81b60] border border-pink-200 rounded-lg text-sm hover:bg-pink-200 transition-colors shadow-sm">5 分</button>
            <button onclick="applyAutoSchedule(10)" class="px-3 py-1.5 bg-[#e1f5fe] text-[#0288d1] border border-blue-200 rounded-lg text-sm hover:bg-blue-200 transition-colors shadow-sm">10 分</button>
            <button onclick="applyAutoSchedule(15)" class="px-3 py-1.5 bg-[#ede7f6] text-[#5e35b1] border border-purple-200 rounded-lg text-sm hover:bg-purple-200 transition-colors shadow-sm">15 分</button>
            <div class="w-px h-5 bg-gray-300 mx-1 hidden sm:block"></div>
            <button onclick="cancelAutoSchedule()" class="px-3 py-1.5 bg-gray-100 text-gray-600 border border-gray-200 rounded-lg text-sm hover:bg-gray-200 transition-colors shadow-sm mt-2 sm:mt-0"><i class="fa-solid fa-xmark mr-1"></i>取消</button>
        </div>
    </header>

    <main class="w-full max-w-3xl space-y-6" id="course-container">
        <!-- 課程區塊將由 JavaScript 動態生成 -->
    </main>

    <footer class="w-full max-w-3xl mt-12 mb-8 glass-panel rounded-2xl p-4 flex flex-wrap justify-around items-center text-sm md:text-base text-[#795548]">
        <div class="flex items-center m-2">
            <div class="w-8 h-8 rounded-full bg-pink-100 flex items-center justify-center mr-2 text-pink-500">
                <i class="fa-solid fa-bullseye"></i>
            </div>
            <div>
                <p class="font-bold">持續學習</p>
                <p class="text-xs text-gray-500">Keep Learning</p>
            </div>
        </div>
        <div class="flex items-center m-2">
            <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center mr-2 text-blue-500">
                <i class="fa-solid fa-chart-line"></i>
            </div>
            <div>
                <p class="font-bold">持續進步</p>
                <p class="text-xs text-gray-500">Keep Growing</p>
            </div>
        </div>
        <div class="flex items-center m-2">
            <div class="w-8 h-8 rounded-full bg-red-100 flex items-center justify-center mr-2 text-red-400">
                <i class="fa-solid fa-heart"></i>
            </div>
            <div>
                <p class="font-bold">更好的自己</p>
                <p class="text-xs text-gray-500">A Better Me</p>
            </div>
        </div>
        <div class="flex items-center m-2">
            <div class="w-8 h-8 rounded-full bg-yellow-100 flex items-center justify-center mr-2 text-yellow-500">
                <i class="fa-solid fa-star"></i>
            </div>
            <div>
                <p class="font-bold">實現夢想</p>
                <p class="text-xs text-gray-500">Make It Happen</p>
            </div>
        </div>
    </footer>

    <!-- 隱藏的按鈕，用於強制初始化音訊 -->
    <button id="init-audio-btn" class="hidden">初始化音訊</button>

    <script>
        // --- 音效系統設定 ---
        let audioCtx;
        let beepInterval;
        let isTicking = false;
        let tickInterval;

        // 初始化 AudioContext，必須在使用者有互動後才能呼叫
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 綁定點擊事件來初始化音訊，這可以突破瀏覽器的自動播放限制
        document.body.addEventListener('click', initAudio, { once: true });
        // 也給輸入框綁定，以防使用者第一個動作是輸入時間
        document.body.addEventListener('input', initAudio, { once: true });

        // 1. 按鈕點擊音效 (柔和的短促聲)
        function playClickSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.05);
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        // 2. 任務完成音效 (輕快的琶音)
        function playSuccessSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const playNote = (freq, startTime, duration) => {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                gainNode.gain.setValueAtTime(0, startTime);
                gainNode.gain.linearRampToValueAtTime(0.15, startTime + 0.05);
                gainNode.gain.linearRampToValueAtTime(0, startTime + duration);
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                osc.start(startTime);
                osc.stop(startTime + duration);
            };
            // 播放 C大調和弦上行：Do(523) -> Mi(659) -> Sol(784) -> 高音Do(1046)
            playNote(523.25, now, 0.15);
            playNote(659.25, now + 0.1, 0.15);
            playNote(783.99, now + 0.2, 0.15);
            playNote(1046.50, now + 0.3, 0.4);
        }

        // 3. 背景滴答聲 (模擬時鐘或節拍器)
        function playTick() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'triangle'; // 三角波有輕微的敲擊感
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.03);
        }

        // 4. 播放「滴滴」兩聲的鬧鐘音效
        function playDoubleBeep() {
            if (!audioCtx) return;

            function playSingleBeep(startTime) {
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                // 使用方波聽起來更像電子鬧鐘
                oscillator.type = 'square';
                // 較高的頻率
                oscillator.frequency.setValueAtTime(1200, startTime); 
                
                // 聲音淡入淡出，避免爆音
                gainNode.gain.setValueAtTime(0, startTime);
                gainNode.gain.linearRampToValueAtTime(0.5, startTime + 0.02);
                gainNode.gain.linearRampToValueAtTime(0, startTime + 0.15);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start(startTime);
                oscillator.stop(startTime + 0.15);
            }

            const now = audioCtx.currentTime;
            playSingleBeep(now);             // 第一聲
            playSingleBeep(now + 0.2);       // 停頓 0.2 秒後發出第二聲
        }

        // --- 音效控制介面功能 ---
        function toggleTicking() {
            initAudio();
            playClickSound();
            isTicking = !isTicking;
            const btn = document.getElementById('tick-btn');
            
            if (isTicking) {
                btn.classList.add('text-pink-500', 'bg-pink-50');
                btn.classList.remove('text-gray-500');
                btn.innerHTML = '<i class="fa-solid fa-stopwatch mr-2 animate-pulse"></i> 專注滴答聲: 開';
                
                // 立即播放一聲，然後設定每秒播放
                playTick();
                tickInterval = setInterval(playTick, 1000);
            } else {
                btn.classList.remove('text-pink-500', 'bg-pink-50');
                btn.classList.add('text-gray-500');
                btn.innerHTML = '<i class="fa-solid fa-stopwatch mr-2"></i> 專注滴答聲: 關';
                clearInterval(tickInterval);
            }
        }

        function testAudio() {
            initAudio();
            playClickSound(); // 先播按鈕聲
            
            // 延遲依序播放不同音效，避免重疊太嚴重
            setTimeout(() => {
                playSuccessSound(); // 模擬完成音效
            }, 300);
            
            setTimeout(() => {
                playDoubleBeep(); // 模擬鬧鐘音效
            }, 1000);
        }
        // --- 結束音效系統設定 ---

        // 自動排程狀態變數
        let autoScheduleMode = false;
        let autoBreakTime = 5;

        // 訊息提示框公用函式
        function showMessage(msg, isSuccess = false) {
            const msgBox = document.createElement('div');
            const colorClasses = isSuccess 
                ? 'bg-green-100 border-green-400 text-green-700' 
                : 'bg-red-100 border-red-400 text-red-700';
            msgBox.className = `fixed top-4 left-1/2 transform -translate-x-1/2 ${colorClasses} border px-4 py-3 rounded-lg z-[100] transition-opacity duration-500 shadow-md font-medium flex items-center whitespace-nowrap`;
            msgBox.innerHTML = msg;
            document.body.appendChild(msgBox);
            setTimeout(() => {
                msgBox.style.opacity = '0';
                setTimeout(() => msgBox.remove(), 500);
            }, 2500);
        }

        // 時間計算輔助函式：加上指定分鐘數
        function addMinutes(timeStr, minsToAdd) {
            if (!timeStr) return '';
            const [h, m] = timeStr.split(':').map(Number);
            const date = new Date();
            date.setHours(h, m, 0, 0);
            date.setMinutes(date.getMinutes() + minsToAdd);
            const newH = date.getHours().toString().padStart(2, '0');
            const newM = date.getMinutes().toString().padStart(2, '0');
            return `${newH}:${newM}`;
        }

        // 顯示/隱藏自動排程選單
        function toggleAutoScheduleMenu() {
            initAudio();
            playClickSound();
            const menu = document.getElementById('auto-schedule-menu');
            if (menu.classList.contains('hidden')) {
                menu.classList.remove('hidden');
                menu.classList.add('flex'); // 使用 flex 排列
                // 微小的延遲確保 CSS transition 動畫生效
                setTimeout(() => {
                    menu.classList.remove('scale-95', 'opacity-0');
                    menu.classList.add('scale-100', 'opacity-100');
                }, 10);
            } else {
                menu.classList.remove('flex');
                menu.classList.add('hidden');
            }
        }

        // 執行自動排程模式設定 (先記下休息分鐘數)
        function applyAutoSchedule(breakMins) {
            initAudio();
            playClickSound();

            autoScheduleMode = true;
            autoBreakTime = breakMins;

            // 改變主按鈕顏色與文字，作為視覺提示
            const btn = document.getElementById('auto-schedule-btn');
            btn.className = 'px-4 py-2 rounded-full text-sm font-medium flex items-center transition-colors shadow-sm cursor-pointer border';
            
            if (breakMins === 5) {
                btn.classList.add('bg-[#fce4ec]', 'text-[#d81b60]', 'border-pink-200', 'hover:bg-pink-200');
            } else if (breakMins === 10) {
                btn.classList.add('bg-[#e1f5fe]', 'text-[#0288d1]', 'border-blue-200', 'hover:bg-blue-200');
            } else if (breakMins === 15) {
                btn.classList.add('bg-[#ede7f6]', 'text-[#5e35b1]', 'border-purple-200', 'hover:bg-purple-200');
            }
            
            // 顯示選擇的分鐘數，不再閃爍，並保持顏色
            btn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles mr-2"></i> 自動排程 (${breakMins}分)`;

            toggleAutoScheduleMenu(); // 成功後關閉選單
            showMessage(`<i class="fa-solid fa-wand-magic-sparkles mr-2"></i>已選擇休息 ${breakMins} 分鐘！<br><span class="text-sm mt-1 inline-block">👉 請設定任意任務的<strong class="text-pink-600">「開始時間」</strong>來觸發連鎖排程。</span>`, true);
        }

        // 取消自動排程並清除所有時間
        function cancelAutoSchedule() {
            initAudio();
            playClickSound();
            
            autoScheduleMode = false;
            
            // 攤平清理所有任務時間與鬧鐘
            for (let c = 0; c < courseData.length; c++) {
                for (let t = 0; t < courseData[c].tasks.length; t++) {
                    courseData[c].tasks[t].startTime = '';
                    courseData[c].tasks[t].endTime = '';
                    courseData[c].tasks[t].isAlarmActive = false;
                }
            }
            
            renderCourses();
            toggleAutoScheduleMenu(); // 關閉選單
            
            // 恢復自動排程按鈕原本的外觀 (預設灰色狀態)
            const btn = document.getElementById('auto-schedule-btn');
            btn.className = 'glass-panel px-4 py-2 rounded-full text-sm font-medium flex items-center text-gray-500 hover:bg-[#fff0f5] hover:text-pink-500 transition-colors shadow-sm cursor-pointer border border-transparent hover:border-pink-200';
            btn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles mr-2"></i> 自動排程';

            showMessage('<i class="fa-solid fa-eraser mr-2"></i>已取消排程並清除所有時間設定。');
        }

        // 一鍵重置所有設定與狀態
        function resetAll() {
            initAudio();
            playClickSound();

            // 1. 停止任何響鈴
            if (activeAlarmTask) {
                clearInterval(beepInterval);
                activeAlarmTask.isRinging = false;
                activeAlarmTask = null;
            }

            // 2. 停止滴答聲
            if (isTicking) {
                toggleTicking(); 
            }

            // 3. 還原自動排程按鈕狀態
            autoScheduleMode = false;
            const autoBtn = document.getElementById('auto-schedule-btn');
            autoBtn.className = 'glass-panel px-4 py-2 rounded-full text-sm font-medium flex items-center text-gray-500 hover:bg-[#fff0f5] hover:text-pink-500 transition-colors shadow-sm cursor-pointer border border-transparent hover:border-pink-200';
            autoBtn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles mr-2"></i> 自動排程';
            
            // 隱藏自動排程子選單
            const menu = document.getElementById('auto-schedule-menu');
            menu.classList.remove('flex');
            menu.classList.add('hidden');

            // 4. 清除所有任務內容 (時間、鬧鐘、打勾狀態)
            courseData.forEach(category => {
                category.tasks.forEach(task => {
                    task.startTime = '';
                    task.endTime = '';
                    task.completed = false;
                    task.isAlarmActive = false;
                    task.isRinging = false;
                    task.isSelected = true; // 新增：重置時將排程勾選狀態恢復
                });
            });

            renderCourses();
            showMessage('<i class="fa-solid fa-rotate-right mr-2"></i>已重置所有任務與排程！', true);
        }

        // 處理任務完成勾選狀態與音效
        function toggleTaskComplete(catIndex, taskIndex, isChecked) {
            initAudio();
            const task = courseData[catIndex].tasks[taskIndex];
            
            // 如果這個任務正在響鈴，點擊打勾就停止鬧鐘
            if (task.isRinging) {
                clearInterval(beepInterval);
                task.isRinging = false;
                activeAlarmTask = null;
            }

            if (isChecked) {
                playSuccessSound(); // 任務完成音效
            } else {
                playClickSound(); // 取消勾選時播一般按鈕音
            }
            
            task.completed = isChecked;
            if (isChecked) {
                task.isAlarmActive = false; // 完成後自動關閉鬧鐘
            }
            renderCourses();
        }

        // 課程資料結構，參考圖片內容
        const courseData = [
            {
                id: 'cat-1',
                title: '英文',
                number: '1',
                themeClass: 'bg-[#faebeb]', // 淺粉背景
                headerColor: 'bg-[#e57373]', // 粉紅標題背景
                quote: 'Small steps every day,\nbig results one day.',
                tasks: [
                    { id: 't1-1', name: '肯定句英文 Speak', startTime: '', endTime: '', icon: 'fa-comment-dots', iconColor: 'text-blue-400', completed: false, isAlarmActive: false },
                    { id: 't1-2', name: '林熙 - 24 天英語口說', startTime: '', endTime: '', icon: 'fa-play-circle', iconColor: 'text-pink-400', completed: false, isAlarmActive: false },
                    { id: 't1-3', name: '抄寫英語的奇蹟', startTime: '', endTime: '', icon: 'fa-book-open', iconColor: 'text-blue-300', completed: false, isAlarmActive: false }
                ]
            },
            {
                id: 'cat-2',
                title: '職安課程及測驗',
                number: '2',
                themeClass: 'bg-[#f0f4eb]', // 淺綠背景
                headerColor: 'bg-[#81c784]', // 綠色標題背景
                quote: '安全工作 健康生活\n守護自己與家人\n從學習開始！<i class="fa-regular fa-heart"></i>',
                tasks: [
                    { id: 't2-1', name: '觀看職安課程', startTime: '', endTime: '', icon: 'fa-video', iconColor: 'text-gray-500', completed: false, isAlarmActive: false },
                    { id: 't2-2', name: '重點筆記整理', startTime: '', endTime: '', icon: 'fa-pen-to-square', iconColor: 'text-yellow-600', completed: false, isAlarmActive: false },
                    { id: 't2-3', name: '完成測驗', startTime: '', endTime: '', icon: 'fa-check-circle', iconColor: 'text-green-500', completed: false, isAlarmActive: false }
                ]
            },
            {
                id: 'cat-3',
                title: 'AI 相關考試',
                number: '3',
                themeClass: 'bg-[#f0f4ff]', // 淺藍背景
                headerColor: 'bg-[#7986cb]', // 藍色標題背景
                quote: '學習新科技\n打開更多可能\n創造更好的未來！<i class="fa-regular fa-heart"></i>',
                tasks: [
                    { id: 't3-1', name: 'iPAS 應用規劃師初級', startTime: '', endTime: '', icon: 'fa-robot', iconColor: 'text-blue-500', completed: false, isAlarmActive: false },
                    { id: 't3-2', name: 'iPAS 應用規劃師中級', startTime: '', endTime: '', icon: 'fa-microchip', iconColor: 'text-indigo-500', completed: false, isAlarmActive: false },
                    { id: 't3-3', name: '人工智慧素養', startTime: '', endTime: '', icon: 'fa-brain', iconColor: 'text-pink-400', completed: false, isAlarmActive: false },
                    { id: 't3-4', name: '資安', startTime: '', endTime: '', icon: 'fa-shield-halved', iconColor: 'text-green-600', completed: false, isAlarmActive: false }
                ]
            }
        ];

        function renderCourses() {
            const container = document.getElementById('course-container');
            container.innerHTML = '';

            courseData.forEach((category, catIndex) => {
                const catDiv = document.createElement('div');
                catDiv.className = `${category.themeClass} rounded-[2rem] p-6 shadow-sm relative overflow-hidden transition-all duration-300 hover:shadow-md`;
                
                // 標題列
                const headerDiv = document.createElement('div');
                headerDiv.className = 'flex flex-col md:flex-row md:items-center justify-between mb-6 border-b border-white/50 pb-4';
                
                const titleWrap = document.createElement('div');
                titleWrap.className = 'flex items-center mb-4 md:mb-0';
                titleWrap.innerHTML = `
                    <div class="${category.headerColor} text-white w-12 h-12 rounded-full flex items-center justify-center text-2xl font-bold shadow-sm mr-4">
                        ${category.number}
                    </div>
                    <h2 class="text-3xl font-bold text-[#4a4a4a] tracking-wider">${category.title} <i class="fa-regular fa-heart text-pink-400 text-xl ml-2"></i></h2>
                `;
                
                const quoteDiv = document.createElement('div');
                quoteDiv.className = 'text-right text-[#8d6e63] font-serif italic text-sm md:text-base leading-relaxed';
                quoteDiv.innerHTML = category.quote.replace(/\n/g, '<br>');

                headerDiv.appendChild(titleWrap);
                headerDiv.appendChild(quoteDiv);
                catDiv.appendChild(headerDiv);

                // 任務列表
                const taskList = document.createElement('div');
                taskList.className = 'space-y-4';

                category.tasks.forEach((task, taskIndex) => {
                    const taskItem = document.createElement('div');
                    
                    // 根據狀態設定不同的外觀 (包含響鈴特效)
                    let itemClasses = `flex flex-col lg:flex-row lg:items-center justify-between bg-white/60 p-4 rounded-xl transition-all duration-200`;
                    if (task.completed) {
                        itemClasses += ` opacity-60`;
                    } else if (task.isRinging) {
                        // 正在響鈴時的特效：粉紅外框、發光陰影、脈衝動畫
                        itemClasses += ` border-2 border-pink-400 shadow-[0_0_15px_rgba(244,114,182,0.6)] bg-pink-50 animate-[pulse_1s_infinite]`;
                        taskItem.id = `ringing-task-${task.id}`;
                    } else if (task.isSelected === false) {
                        // 未勾選加入排程時的視覺微調
                        itemClasses += ` opacity-80 grayscale-[20%]`;
                    } else {
                        itemClasses += ` hover:bg-white`;
                    }
                    taskItem.className = itemClasses;
                    
                    const leftCol = document.createElement('div');
                    leftCol.className = 'flex items-center mb-4 lg:mb-0 w-full lg:w-1/3 flex-grow';
                    
                    const flexDiv = document.createElement('div');
                    flexDiv.className = 'flex items-center w-full';

                    // 1. 排程選取 Checkbox (新加入)
                    const selectCheckbox = document.createElement('input');
                    selectCheckbox.type = 'checkbox';
                    selectCheckbox.className = 'w-5 h-5 mr-3 flex-shrink-0 cursor-pointer accent-pink-500 rounded border-gray-300';
                    selectCheckbox.checked = task.isSelected !== false; // 預設為 true (包含 undefined)
                    selectCheckbox.title = "勾選加入自動排程";
                    selectCheckbox.onchange = (e) => {
                        initAudio();
                        playClickSound();
                        task.isSelected = e.target.checked;
                        renderCourses();
                    };
                    flexDiv.appendChild(selectCheckbox);

                    // 2. 完成 Checkbox (原本的 custom-checkbox)
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.className = 'custom-checkbox mr-4 flex-shrink-0';
                    checkbox.checked = task.completed;
                    checkbox.onchange = (e) => toggleTaskComplete(catIndex, taskIndex, e.target.checked);
                    flexDiv.appendChild(checkbox);
                    
                    // 3. Number badge (only for English category based on image)
                    if (category.id === 'cat-1') {
                        const bgColors = ['bg-pink-300', 'bg-indigo-300', 'bg-blue-400'];
                        const numBadge = document.createElement('div');
                        numBadge.className = `${bgColors[taskIndex % 3]} text-white w-7 h-7 rounded-full flex items-center justify-center text-sm font-bold mr-3 flex-shrink-0 shadow-sm`;
                        numBadge.textContent = taskIndex + 1;
                        flexDiv.appendChild(numBadge);
                    }

                    // 4. Task Name
                    const nameSpan = document.createElement('span');
                    nameSpan.className = `text-lg font-medium transition-colors ${task.isSelected === false ? 'text-gray-400' : 'text-[#5d4037]'} ${task.completed ? 'line-through' : ''}`;
                    nameSpan.textContent = task.name;
                    flexDiv.appendChild(nameSpan);

                    leftCol.appendChild(flexDiv);

                    const rightCol = document.createElement('div');
                    rightCol.className = 'flex flex-col sm:flex-row items-start sm:items-center space-y-2 sm:space-y-0 sm:space-x-3 ml-[2.5rem] lg:ml-0';

                    // 裝飾圖示
                    if (task.icon) {
                        const iconSpan = document.createElement('div');
                        iconSpan.className = `w-8 h-8 rounded-full bg-white flex items-center justify-center shadow-sm ${task.iconColor} mr-2 hidden lg:flex flex-shrink-0`;
                        iconSpan.innerHTML = `<i class="fa-solid ${task.icon}"></i>`;
                        rightCol.appendChild(iconSpan);
                    }

                    // 時間設定群組
                    const timeContainer = document.createElement('div');
                    timeContainer.className = 'flex flex-wrap items-center gap-2 w-full sm:w-auto';

                    // 開始時間 (加入鎖定時的灰階背景與透明度視覺特效)
                    const startTimeGroup = document.createElement('div');
                    startTimeGroup.className = `flex items-center rounded-lg p-1 border shadow-inner flex-1 sm:flex-none transition-all duration-300 ${task.completed ? 'bg-gray-100 border-gray-300 opacity-60' : 'bg-white border-gray-200'}`;
                    startTimeGroup.innerHTML = `<span class="text-xs ${task.completed ? 'text-gray-400' : 'text-gray-500'} mr-1 ml-1 whitespace-nowrap">開始</span>`;
                    
                    const startTimeInput = document.createElement('input');
                    startTimeInput.type = 'time';
                    startTimeInput.className = `bg-transparent border-none outline-none font-medium px-1 text-sm w-full sm:w-auto transition-colors ${task.completed ? 'text-gray-400 cursor-not-allowed' : 'text-[#5d4037]'}`;
                    startTimeInput.value = task.startTime;
                    startTimeInput.disabled = task.completed; // 完成時鎖定
                    startTimeInput.onchange = (e) => updateTaskTime(catIndex, taskIndex, 'startTime', e.target.value);
                    startTimeGroup.appendChild(startTimeInput);

                    // 結束時間 (加入鎖定時的灰階背景與透明度視覺特效)
                    const endTimeGroup = document.createElement('div');
                    endTimeGroup.className = `flex items-center rounded-lg p-1 border shadow-inner flex-1 sm:flex-none transition-all duration-300 ${task.completed ? 'bg-gray-100 border-gray-300 opacity-60' : 'bg-white border-gray-200'}`;
                    endTimeGroup.innerHTML = `<span class="text-xs ${task.completed ? 'text-gray-400' : 'text-gray-500'} mr-1 ml-1 whitespace-nowrap">結束</span>`;
                    
                    const endTimeInput = document.createElement('input');
                    endTimeInput.type = 'time';
                    endTimeInput.className = `bg-transparent border-none outline-none font-medium px-1 text-sm w-full sm:w-auto transition-colors ${task.completed ? 'text-gray-400 cursor-not-allowed' : 'text-[#5d4037]'}`;
                    endTimeInput.value = task.endTime;
                    endTimeInput.disabled = task.completed || task.isAlarmActive; // 鬧鐘依據結束時間，啟用時鎖定，完成時也鎖定
                    endTimeInput.onchange = (e) => updateTaskTime(catIndex, taskIndex, 'endTime', e.target.value);
                    endTimeGroup.appendChild(endTimeInput);

                    // 鬧鐘切換按鈕
                    const alarmBtn = document.createElement('button');
                    alarmBtn.className = `p-2 rounded-md transition-colors flex-shrink-0 ml-auto sm:ml-0 ${task.isAlarmActive ? 'bg-pink-100 text-pink-500' : 'text-gray-400 hover:bg-gray-100'} ${task.completed ? 'opacity-50 cursor-not-allowed' : ''}`;
                    alarmBtn.disabled = task.completed;
                    alarmBtn.innerHTML = `<i class="fa-solid fa-bell${task.isAlarmActive ? ' ring-animation' : ''}"></i>`;
                    alarmBtn.onclick = () => toggleAlarm(catIndex, taskIndex);
                    
                    if(!task.endTime && !task.isAlarmActive) {
                        alarmBtn.title = "請先設定結束時間";
                    } else if (task.isAlarmActive) {
                         alarmBtn.title = "點擊取消鬧鐘";
                    } else {
                         alarmBtn.title = "點擊開啟鬧鐘 (依據結束時間)";
                    }

                    timeContainer.appendChild(startTimeGroup);
                    timeContainer.appendChild(endTimeGroup);
                    timeContainer.appendChild(alarmBtn);

                    rightCol.appendChild(timeContainer);

                    taskItem.appendChild(leftCol);
                    taskItem.appendChild(rightCol);
                    taskList.appendChild(taskItem);
                });

                catDiv.appendChild(taskList);
                container.appendChild(catDiv);
            });
        }
        
        // 執行連鎖排程計算
        function executeCascadeSchedule(startCatIdx, startTaskIdx, startT) {
            let allTasks = [];
            let startIndex = -1;
            
            // 將所有任務攤平為一維陣列以便依序處理
            for (let c = 0; c < courseData.length; c++) {
                for (let t = 0; t < courseData[c].tasks.length; t++) {
                    allTasks.push(courseData[c].tasks[t]);
                    if (c === startCatIdx && t === startTaskIdx) {
                        startIndex = allTasks.length - 1;
                    }
                }
            }

            // 設定起始任務的結束時間 (學習25分)
            let currentEndTime = addMinutes(startT, 25);
            allTasks[startIndex].endTime = currentEndTime;

            // 從基準點的下一個任務開始往後推算
            let scheduledCount = 1;
            for (let i = startIndex + 1; i < allTasks.length; i++) {
                let t = allTasks[i];
                
                // 【重點修改】：如果沒有勾選加入排程，則跳過此項目不設定時間
                if (t.isSelected === false) {
                    continue;
                }
                
                // 休息 breakMins 分鐘後開始下一個
                let newStartTime = addMinutes(currentEndTime, autoBreakTime); 
                // 學習 25 分鐘後結束
                let newEndTime = addMinutes(newStartTime, 25);   
                
                t.startTime = newStartTime;
                t.endTime = newEndTime;
                
                currentEndTime = newEndTime;
                scheduledCount++;
            }

            showMessage(`<i class="fa-solid fa-check-circle mr-2"></i>已為 ${scheduledCount} 個選取的項目自動排程！`, true);
        }

        function updateTaskTime(catIndex, taskIndex, timeType, timeValue) {
            initAudio();
            playClickSound(); // 設定時間時發出按鍵音
            
            courseData[catIndex].tasks[taskIndex][timeType] = timeValue;

            // 如果啟動了自動排程模式，且使用者設定了「開始時間」
            if (autoScheduleMode && timeType === 'startTime' && timeValue) {
                executeCascadeSchedule(catIndex, taskIndex, timeValue);
                autoScheduleMode = false; // 觸發一次後自動關閉模式
            }
            
            // 重新渲染以更新可能的按鈕狀態
            renderCourses();
        }

        function toggleAlarm(catIndex, taskIndex) {
            initAudio();
            playClickSound(); // 開關鬧鐘時發出按鍵音
            
            const task = courseData[catIndex].tasks[taskIndex];
            
            // 如果正在響鈴，點擊鬧鐘按鈕也可以把它關掉
            if (task.isRinging) {
                clearInterval(beepInterval);
                task.isRinging = false;
                activeAlarmTask = null;
                renderCourses();
                return;
            }

            if (!task.endTime) {
                showMessage('<strong class="font-bold">提示：</strong><span class="block sm:inline ml-1"> 請先設定預計結束的時間！</span>');
                return;
            }
            task.isAlarmActive = !task.isAlarmActive;
            renderCourses();
        }

        // 檢查鬧鐘與更新時鐘
        let activeAlarmTask = null;

        function updateClockAndCheckAlarms() {
            const now = new Date();
            // 更新頁面時間顯示
            document.getElementById('current-time').textContent = now.toLocaleTimeString('zh-TW', { hour12: false });

            const currentHour = now.getHours().toString().padStart(2, '0');
            const currentMinute = now.getMinutes().toString().padStart(2, '0');
            const currentTimeStr = `${currentHour}:${currentMinute}`;
            const currentSecond = now.getSeconds();

            // 每分鐘的第0秒檢查一次鬧鐘，避免同一分鐘內重複觸發
            if (currentSecond === 0 && !activeAlarmTask) {
                for (const category of courseData) {
                    for (const task of category.tasks) {
                        // 檢查 endTime 是否符合當前時間，且鬧鐘有開啟，且任務未完成
                        if (task.isAlarmActive && !task.completed && task.endTime === currentTimeStr) {
                            triggerAlarm(task);
                            // 觸發後將其設為未啟用，並標記為正在響鈴
                            task.isAlarmActive = false; 
                            task.isRinging = true;
                            renderCourses();
                            
                            // 捲動畫面到正在響鈴的任務
                            setTimeout(() => {
                                const el = document.getElementById(`ringing-task-${task.id}`);
                                if(el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            }, 100);
                            return; // 一次只觸發一個
                        }
                    }
                }
            }
        }

        function triggerAlarm(task) {
            activeAlarmTask = task;
            
            // 確保音訊系統已初始化並喚醒
            initAudio();

            // 立即播放一次聲音
            playDoubleBeep();
            // 每 1.5 秒重複播放一次雙聲嗶聲
            beepInterval = setInterval(playDoubleBeep, 1500); 
        }

        // 初始化
        window.onload = () => {
            renderCourses();
            updateClockAndCheckAlarms();
            setInterval(updateClockAndCheckAlarms, 1000); // 每秒更新時間
        };

        // 添加自定義動畫 style
        const style = document.createElement('style');
        style.innerHTML = `
            .ring-animation {
                animation: gentle-ring 2s infinite;
            }
            @keyframes gentle-ring {
                0% { transform: rotate(0); }
                5% { transform: rotate(15deg); }
                10% { transform: rotate(-10deg); }
                15% { transform: rotate(5deg); }
                20% { transform: rotate(-5deg); }
                25% { transform: rotate(0); }
                100% { transform: rotate(0); }
            }
        `;
        document.head.appendChild(style);

    </script>
